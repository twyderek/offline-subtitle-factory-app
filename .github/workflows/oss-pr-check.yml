name: OSS pull request checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-license:
    name: Documentation and license (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check governance documents
        run: npm run docs:check
      - name: Check license and contribution entry points
        shell: bash
        run: |
          test -s LICENSE
          grep -q "MIT License" LICENSE
          test -s CONTRIBUTING.md
          test -s THIRD-PARTY-NOTICES.md
          test -s SECURITY.md
          test -s docs/OSS-APPLICATION-READINESS.md
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  windows-regression:
    name: Windows source regression (not installer acceptance)
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare checksummed Windows runtime
        shell: pwsh
        run: ./scripts/prepare-windows-runtime.ps1
      - name: Execute source regression tests
        run: npm run check
