name: "Feature request / 功能建議"
description: "提出可討論的新功能或使用體驗改善"
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: "欲解決的問題 / Problem"
      description: "請說明實際的字幕製作或校閱情境"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "建議解法 / Proposed solution"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "已考慮的替代方案 / Alternatives"
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: "隱私注意事項 / Privacy"
      options:
        - label: "本提案沒有包含真實金鑰、私人影音或其他機密資料"
          required: true
